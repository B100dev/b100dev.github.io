<!DOCTYPE html>
<!--
  Minimal landing page that forwards to the toolbox.

  Destination is set in three places — change all three if it ever moves:
    1. the <meta http-equiv="refresh"> tag  (works without JavaScript)
    2. the <a id="go"> link                 (manual fallback)
    3. the DEST constant in the script      (the actual redirect)
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Redirecting…</title>
<meta name="description" content="Redirecting to the toolbox.">
<meta name="robots" content="noindex, follow">

<!-- No-JS fallback -->
<meta http-equiv="refresh" content="3;url=https://b100dev.github.io/toolbox/#/">
<link rel="canonical" href="https://b100dev.github.io/toolbox/#/">

<meta name="theme-color" content="#0b0d12" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#fbfbfd" media="(prefers-color-scheme: light)">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.92em' font-size='88'>🧰</text></svg>">

<style>
:root{
  --bg:#fbfbfd; --elev:#ffffff;
  --text:#14161c; --muted:#5a6070; --faint:#868da0;
  --line:#e6e8ef; --line-strong:#d3d7e2;
  --accent:#3f5bd9; --accent-soft:rgba(63,91,217,.10);
  --glow-1:rgba(63,91,217,.16); --glow-2:rgba(16,185,166,.13);
  --shadow:0 1px 2px rgba(16,20,34,.04), 0 10px 30px -14px rgba(16,20,34,.16);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0b0d12; --elev:#12151d;
    --text:#eceef4; --muted:#9aa2b6; --faint:#6e7689;
    --line:#212634; --line-strong:#2d3446;
    --accent:#8aa0ff; --accent-soft:rgba(138,160,255,.12);
    --glow-1:rgba(93,120,255,.22); --glow-2:rgba(16,185,166,.16);
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 14px 36px -18px rgba(0,0,0,.85);
  }
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; display:grid; place-items:center; padding:24px;
  background:var(--bg); color:var(--text);
  font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  font-size:16px; line-height:1.6; -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
.aura{position:fixed; inset:0; z-index:-1; pointer-events:none; overflow:hidden}
.aura::before,.aura::after{content:""; position:absolute; border-radius:50%; filter:blur(90px)}
.aura::before{width:560px;height:560px;top:-220px;left:-140px;background:var(--glow-1)}
.aura::after{width:460px;height:460px;bottom:-200px;right:-160px;background:var(--glow-2)}

.card{
  width:100%; max-width:26rem; text-align:center;
  background:var(--elev); border:1px solid var(--line);
  border-radius:20px; padding:40px 32px 32px; box-shadow:var(--shadow);
  animation:rise .5s cubic-bezier(.22,.8,.3,1) both;
}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

.mark{
  width:52px;height:52px;margin:0 auto;border-radius:15px;display:grid;place-items:center;
  background:var(--accent-soft); color:var(--accent);
}
.mark svg{width:25px;height:25px}

h1{margin:22px 0 0; font-size:1.32rem; font-weight:640; letter-spacing:-.02em; line-height:1.3}
.sub{margin:10px 0 0; color:var(--muted); font-size:15px}

.host{
  display:inline-block; margin-top:18px; max-width:100%;
  font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  font-size:12.5px; color:var(--muted);
  background:var(--bg); border:1px solid var(--line);
  padding:5px 11px; border-radius:8px;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}

.track{margin-top:24px; height:3px; border-radius:99px; background:var(--line); overflow:hidden}
.bar{height:100%; width:0; border-radius:99px; background:var(--accent); animation:fill 3s linear forwards}
@keyframes fill{to{width:100%}}

.go{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  margin-top:24px; width:100%;
  text-decoration:none; font-size:15px; font-weight:560;
  padding:11px 20px; border-radius:11px;
  background:var(--text); color:var(--bg); border:1px solid transparent;
  transition:transform .18s ease, opacity .18s ease;
}
.go:hover{transform:translateY(-2px)}
.go svg{width:16px;height:16px}
.go:focus-visible{outline:2px solid var(--accent); outline-offset:3px}

.note{margin-top:14px; font-size:12.5px; color:var(--faint)}

@media (prefers-reduced-motion: reduce){
  .card{animation:none}
  .bar{animation:none; width:100%}
  *{transition-duration:.01ms !important}
}
@media (max-width:420px){
  .card{padding:32px 22px 26px; border-radius:16px}
}
</style>
</head>
<body>
<div class="aura" aria-hidden="true"></div>

<main class="card">
  <div class="mark" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2.5" y="7.5" width="19" height="12.5" rx="2.5"/>
      <path d="M9 7.5V6a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v1.5"/>
      <path d="M2.5 13h19"/><path d="M10 13v2h4v-2"/>
    </svg>
  </div>

  <h1>Heading to the toolbox</h1>
  <p class="sub">One moment — you're being redirected.</p>
  <span class="host">b100dev.github.io/toolbox</span>

  <div class="track" role="progressbar" aria-label="Redirecting"><div class="bar"></div></div>

  <a class="go" id="go" href="https://b100dev.github.io/toolbox/#/">
    Go now
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
  </a>

  <p class="note">Not moving? Use the button above.</p>
</main>

<script>
(function(){
  var DEST = 'https://b100dev.github.io/toolbox/#/';
  var DELAY = 2600;
  document.getElementById('go').setAttribute('href', DEST);
  setTimeout(function(){ window.location.replace(DEST); }, DELAY);
})();
</script>
</body>
</html>
