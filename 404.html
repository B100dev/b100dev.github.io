<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found</title>
<meta name="theme-color" content="#0b0d12" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#fbfbfd" media="(prefers-color-scheme: light)">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👋</text></svg>">
<style>
:root{--bg:#fbfbfd;--text:#14161c;--muted:#5a6070;--line:#e6e8ef;--elev:#fff;--accent:#3f5bd9;--glow:rgba(63,91,217,.16)}
@media (prefers-color-scheme: dark){:root{--bg:#0b0d12;--text:#eceef4;--muted:#9aa2b6;--line:#212634;--elev:#12151d;--accent:#8aa0ff;--glow:rgba(93,120,255,.22)}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--text);
 font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;line-height:1.6;overflow-x:hidden}
body::before{content:"";position:fixed;top:-220px;left:50%;transform:translateX(-50%);width:600px;height:420px;
 background:var(--glow);filter:blur(90px);z-index:-1;border-radius:50%}
.box{text-align:center;max-width:34rem}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;letter-spacing:.1em;
 color:var(--muted);border:1px solid var(--line);background:var(--elev);padding:5px 12px;border-radius:999px;display:inline-block}
h1{font-size:clamp(1.9rem,6vw,2.6rem);letter-spacing:-.022em;margin:22px 0 0}
p{color:var(--muted);margin:14px 0 0}
a.btn{display:inline-flex;align-items:center;gap:8px;margin-top:28px;text-decoration:none;font-weight:560;font-size:15px;
 padding:11px 20px;border-radius:11px;background:var(--text);color:var(--bg);transition:transform .18s}
a.btn:hover{transform:translateY(-2px)}
</style>
</head>
<body>
  <div class="box">
    <span class="code">404</span>
    <h1>This page wandered off.</h1>
    <p>The link may be old, or the page may have moved. No harm done — everything else is still where it should be.</p>
    <a class="btn" href="/">Back to the homepage</a>
  </div>
</body>
</html>
